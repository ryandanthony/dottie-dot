# Dottie Configuration for KDE Neon (Ubuntu-based)
# Usage:
#   dottie validate minimal
#   dottie validate dev
#   dottie link -p minimal
#   dottie link -p dev
#   dottie install -p minimal
#   dottie install -p dev

profiles:
  # ============================================================================
  # MINIMAL PROFILE
  # Base system with essential CLI tools and shell configuration
  # ============================================================================
  minimal:
    dotfiles:
      # Bash profile with aliases and Starship integration
      - source: dotfiles/.bashrc
        target: ~/.bashrc
      
      # Starship prompt configuration (PowerShell - blue scheme)
      - source: dotfiles/starship.toml
        target: ~/.config/starship.toml

      # Starship prompt configuration (Bash - green scheme)
      - source: dotfiles/starship-bash.toml
        target: ~/.config/starship-bash.toml

      # Git configuration
      - source: dotfiles/.gitconfig
        target: ~/.gitconfig

      # VS Code settings
      - source: dotfiles/Code/User/settings.json
        target: ~/.config/Code/User/settings.json

    install:
      # Fonts - JetBrains Mono (primary dev font with ligatures)
      fonts:
        - name: "JetBrainsMono Nerd Font"
          url: "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.4.0/JetBrainsMono.zip"

      # GitHub releases - binaries installed to ~/bin
      github:
        - repo: jqlang/jq
          asset: "jq-linux-amd64"
          binary: jq
        - repo: starship/starship
          asset: "starship-x86_64-unknown-linux-gnu.tar.gz"
          binary: starship
        - repo: github/copilot-cli
          asset: "copilot-linux-x64.tar.gz"
          binary: copilot

      # APT packages - basic CLI tools
      apt:
        - git
        - curl
        - wget
        - htop
        - tree
        - unzip
        - ca-certificates
        - gnupg
        - lsb-release
        - apt-transport-https
        - software-properties-common
        - ttf-mscorefonts-installer
        - libfuse2

      # Custom scripts
      #scripts:

      # APT repositories with packages
      aptRepos:
        # GitHub CLI
        - name: github-cli
          key_url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
          repo: "deb [arch=${MS_ARCH}] https://cli.github.com/packages stable main"
          packages:
            - gh

  # ============================================================================
  # s PROFILE
  # Desktop applications extending minimal profile
  # ============================================================================
  desktop:
    extends: minimal

    dotfiles:
      # KDE Plasma global settings (theme, colors, default apps)
      - source: dotfiles/kde/config/kdeglobals
        target: ~/.config/kdeglobals

      # KWin window manager (tiling, desktops, night color, Xwayland scale)
      - source: dotfiles/kde/config/kwinrc
        target: ~/.config/kwinrc

      # Global keyboard shortcuts
      - source: dotfiles/kde/config/kglobalshortcutsrc
        target: ~/.config/kglobalshortcutsrc

      # Plasma desktop layout (panels, applets, widgets, wallpaper)
      - source: dotfiles/kde/config/plasma-org.kde.plasma.desktop-appletsrc
        target: ~/.config/plasma-org.kde.plasma.desktop-appletsrc

      # Plasma shell settings (panel size, floating)
      - source: dotfiles/kde/config/plasmashellrc
        target: ~/.config/plasmashellrc

      # Plasma general settings
      - source: dotfiles/kde/config/plasmarc
        target: ~/.config/plasmarc

      # Display/monitor configuration
      - source: dotfiles/kde/config/kwinoutputconfig.json
        target: ~/.config/kwinoutputconfig.json

      # Mouse/touchpad input settings
      - source: dotfiles/kde/config/kcminputrc
        target: ~/.config/kcminputrc

      # Konsole terminal settings
      - source: dotfiles/kde/config/konsolerc
        target: ~/.config/konsolerc

      # Dolphin file manager settings
      - source: dotfiles/kde/config/dolphinrc
        target: ~/.config/dolphinrc

      # Kate text editor settings
      - source: dotfiles/kde/config/katerc
        target: ~/.config/katerc

      # Session management
      - source: dotfiles/kde/config/ksmserverrc
        target: ~/.config/ksmserverrc

      # Locale/language settings
      - source: dotfiles/kde/config/plasma-localerc
        target: ~/.config/plasma-localerc

      # MIME type / default application associations
      - source: dotfiles/kde/config/mimeapps.list
        target: ~/.config/mimeapps.list

      # Baloo file indexer settings (search index exclusions)
      - source: dotfiles/kde/config/baloofilerc
        target: ~/.config/baloofilerc

      # KIO settings (file operations, delete confirmations)
      - source: dotfiles/kde/config/kiorc
        target: ~/.config/kiorc

      # Spectacle screenshot tool settings
      - source: dotfiles/kde/config/spectaclerc
        target: ~/.config/spectaclerc

      # PlasmaZones (FancyZones-style KWin tiling) — durable config only.
      # Runtime/UI state (session.json, plasmazones-settings.conf, *.bak,
      # *.migrated) is intentionally NOT tracked; those are per-machine and
      # regenerated by the daemon. See scripts/install-plasmazones.sh for the
      # effect plugin build.
      - source: dotfiles/kde/config/plasmazones/config.json
        target: ~/.config/plasmazones/config.json
      # Window-matching rules (which apps snap, engine modes)
      - source: dotfiles/kde/config/plasmazones/rules.json
        target: ~/.config/plasmazones/rules.json
      # Per-layout appearance (zone numbers, zone styling)
      - source: dotfiles/kde/config/plasmazones/layout-settings.json
        target: ~/.config/plasmazones/layout-settings.json

      # GTK2 theme integration
      - source: dotfiles/kde/config/gtkrc
        target: ~/.config/gtkrc

      # GTK3 theme integration (dark theme, cursor, icons, font)
      - source: dotfiles/kde/config/gtk-3.0/settings.ini
        target: ~/.config/gtk-3.0/settings.ini

      # GTK4 theme integration
      - source: dotfiles/kde/config/gtk-4.0/settings.ini
        target: ~/.config/gtk-4.0/settings.ini

      # Autostart - Insync (Google Drive / OneDrive sync)
      - source: dotfiles/kde/config/autostart/insync.desktop
        target: ~/.config/autostart/insync.desktop

      # Custom MIME types (.sln, .slnx for Rider)
      - source: dotfiles/kde/mime/packages/custom-mimetypes.xml
        target: ~/.local/share/mime/packages/custom-mimetypes.xml
        postLink: "update-mime-database ~/.local/share/mime"

      # Typora - GitHub Soft Dark theme
      - source: dotfiles/Typora/themes/github-soft-dark.css
        target: ~/.config/Typora/themes/github-soft-dark.css

      # Typora - GitHub Soft Dark theme (codeblock highlighting)
      - source: dotfiles/Typora/themes/github-soft-dark/codeblock.dark.css
        target: ~/.config/Typora/themes/github-soft-dark/codeblock.dark.css

      # Typora - GitHub Soft Dark theme (mermaid dark mode)
      - source: dotfiles/Typora/themes/github-soft-dark/mermaid.dark.css
        target: ~/.config/Typora/themes/github-soft-dark/mermaid.dark.css

      # Typora - GitHub Soft Dark theme (source mode styling)
      - source: dotfiles/Typora/themes/github-soft-dark/sourcemode.dark.css
        target: ~/.config/Typora/themes/github-soft-dark/sourcemode.dark.css

    install:
      # APT packages - desktop tools
      apt:
        - flameshot
        - kmail
        - qalculate-gtk
        - remmina
        - remmina-plugin-rdp
        - remmina-plugin-secret
        - qemu-kvm
        - libvirt-daemon-system
        - libvirt-clients
        - bridge-utils
        - virt-manager
        - ovmf
        - swtpm
        - swtpm-tools
        - kwin-common
        - liblayershellqtinterface6
        - libqt6shadertools6
        - libkf6kcmutils-bin
        - plasma-activities

      # Custom scripts for desktop setup
      scripts:
        - scripts/setup-libvirt.sh
        # PlasmaZones (KDE zone/tiling manager, FancyZones-like). Built from
        # source against the system Qt/KWin: the prebuilt .deb is ABI-locked to
        # Debian's older Qt and won't load on KDE Neon. See the script header.
        - scripts/install-plasmazones.sh

      # GitHub releases - desktop app binaries
      github:
        # Joplin - Note-taking and to-do app
        - repo: laurent22/joplin
          asset: "Joplin-${RELEASE_VERSION}.deb"
          type: deb

        # PlasmaZones - KDE zone/tiling manager (like FancyZones)
        # Installed via scripts/install-plasmazones.sh (source build), NOT here:
        # the prebuilt .deb hard-pins qt6-*-private-abi (= 6.10.2) but KDE Neon
        # ships Qt 6.11.1. Qt private ABIs are version-locked, so the release
        # binary is uninstallable and the KWin effect won't load. Not in any
        # apt repo for Ubuntu/Neon either.
        # - repo: fuddlesworth/PlasmaZones
        #   asset: "plasmazones_${RELEASE_VERSION}-1_amd64.deb"
        #   type: deb

        # Obsidian - Note-taking app.
        # NOTE: Obsidian publishes mobile-only releases (APK) as GitHub's
        # "latest" (e.g. v1.13.8), while the desktop .deb only ships in older
        # tags. v1.9.14 is the newest tag containing obsidian_*_amd64.deb, so
        # pin `version` — otherwise @latest resolves to a mobile release with
        # no matching .deb asset. Bump when a newer desktop tag ships a .deb.
        # `version` must be the LITERAL git tag (dottie queries
        # releases/tags/<version> verbatim), hence the leading `v`.
        # ${RELEASE_VERSION} strips that `v`, so the asset stays 1.9.14.
        - repo: obsidianmd/obsidian-releases
          asset: "obsidian_${RELEASE_VERSION}_amd64.deb"
          type: deb
          version: v1.9.14


      # Snap packages - desktop apps
      snaps:
        - name: shortwave

      # APT repositories with packages
      aptRepos:
        # Google Chrome
        - name: google-chrome
          key_url: https://dl.google.com/linux/linux_signing_key.pub
          repo: "deb [arch=${MS_ARCH}] https://dl.google.com/linux/chrome/deb/ stable main"
          packages:
            - google-chrome-stable

        # Spotify
        - name: spotify
          key_url: https://download.spotify.com/debian/pubkey_5384CE82BA52C83A.asc
          repo: "deb https://repository.spotify.com stable non-free"
          packages:
            - spotify-client

        # Typora - Markdown editor
        - name: typora
          key_url: https://downloads.typora.io/typora.gpg
          repo: "deb [signed-by=${SIGNING_FILE}] https://downloads.typora.io/linux ./"
          packages:
            - typora

        # Insync - Google Drive / OneDrive sync client
        - name: insync
          key_url: https://apt.insync.io/insynchq.gpg
          repo: "deb [signed-by=${SIGNING_FILE}] http://apt.insync.io/ubuntu ${VERSION_CODENAME} non-free contrib"
          packages:
            - insync
            #- insync-headless

        # Claude Desktop - Anthropic's Claude desktop app (beta on Linux)
        # https://code.claude.com/docs/en/desktop-linux
        - name: claude-desktop
          key_url: https://downloads.claude.ai/claude-desktop/key.asc
          repo: "deb [arch=${MS_ARCH} signed-by=${SIGNING_FILE}] https://downloads.claude.ai/claude-desktop/apt/stable stable main"
          packages:
            - claude-desktop

  # ============================================================================
  # DEV PROFILE
  # Full development environment extending desktop profile
  # ============================================================================
  dev:
    extends: desktop

    dotfiles:
      # PowerShell profile with Starship integration
      - source: dotfiles/Microsoft.PowerShell_profile.ps1
        target: ~/.config/powershell/Microsoft.PowerShell_profile.ps1

    install:
      # APT packages for dev
      apt:
        - build-essential

      # GitHub releases - dev tooling binaries installed to ~/bin
      github:
        # k9s - Kubernetes terminal UI
        - repo: derailed/k9s
          asset: "k9s_Linux_${MS_ARCH}.tar.gz"
          binary: k9s

        # yq - YAML processor
        - repo: mikefarah/yq
          asset: "yq_linux_${MS_ARCH}"
          binary: yq

        # kustomize - Kubernetes native config management
        - repo: kubernetes-sigs/kustomize
          asset: "kustomize_v5.8.1_linux_${MS_ARCH}.tar.gz"
          binary: kustomize
          version: "kustomize/v5.8.1"

        # uv - Python package and project manager
        - repo: astral-sh/uv
          asset: "uv-${ARCH}-unknown-linux-gnu.tar.gz"
          binary: uv
          version: "0.10.4"

        # uvx - Python tool runner (from uv)
        - repo: astral-sh/uv
          asset: "uv-${ARCH}-unknown-linux-gnu.tar.gz"
          binary: uvx
          version: "0.10.4"

        # just - Command runner (like make but better)
        - repo: casey/just
          asset: "just-${RELEASE_VERSION}-${ARCH}-unknown-linux-musl.tar.gz"
          binary: just

        # jcode - Terminal coding agent
        # Installed via scripts/install-jcode.sh: the release tarball ships the
        # binary as jcode-linux-<arch> plus a sidecar .bin payload.

        # lazygit - Terminal UI for git
        - repo: jesseduffield/lazygit
          asset: "lazygit_${RELEASE_VERSION}_Linux_${ARCH}.tar.gz"
          binary: lazygit

        # kubectx - Fast Kubernetes context switching
        - repo: ahmetb/kubectx
          asset: "kubectx_v${RELEASE_VERSION}_linux_${ARCH}.tar.gz"
          binary: kubectx

        # kubens - Fast Kubernetes namespace switching
        - repo: ahmetb/kubectx
          asset: "kubens_v${RELEASE_VERSION}_linux_${ARCH}.tar.gz"
          binary: kubens

        # NATS CLI - NATS server management CLI
        - repo: nats-io/natscli
          asset: "nats-${RELEASE_VERSION}-${MS_ARCH}.deb"
          type: deb

        # NATS NSC - A tool for creating NATS account and user access configurations
        - repo: nats-io/nsc
          asset: "nsc-v${RELEASE_VERSION}-${MS_ARCH}.deb"
          type: deb


        # draw.io - Diagramming tool
        - repo: jgraph/drawio-desktop
          asset: "drawio-${MS_ARCH}-${RELEASE_VERSION}.deb"
          type: deb

        # OpenLens - Kubernetes IDE
        - repo: MuhammedKalkan/OpenLens
          asset: "OpenLens-${RELEASE_VERSION}.${MS_ARCH}.deb"
          type: deb

      # Custom scripts for dev tools
      scripts:
        - scripts/setup-github-ssh.sh
        - scripts/setup-docker-security.sh
        - scripts/install-vscode-extensions.sh
        - scripts/install-jetbrains-toolbox.sh
        - scripts/install-specify-cli.sh
        - scripts/install-nvm.sh
        - scripts/install-dotnet-sdk.sh
        - scripts/install-jcode.sh

      # APT repositories with packages
      aptRepos:
        # Kubernetes packages
        - name: kubernetes
          key_url: https://pkgs.k8s.io/core:/stable:/v1.34/deb/Release.key
          repo: "deb [signed-by=${SIGNING_FILE}] https://pkgs.k8s.io/core:/stable:/v1.34/deb/ /"
          packages:
            - kubectl

        # Docker
        - name: docker
          key_url: https://download.docker.com/linux/ubuntu/gpg
          repo: "deb [arch=${MS_ARCH}] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable"
          packages:
            - docker-ce
            - docker-ce-cli
            - containerd.io
            - docker-buildx-plugin
            - docker-compose-plugin

        # Microsoft packages (.NET, PowerShell, Azure CLI)
        - name: microsoft-packages
          key_url: https://packages.microsoft.com/keys/microsoft.asc
          repo: "deb [arch=${MS_ARCH}] https://packages.microsoft.com/repos/microsoft-ubuntu-${VERSION_CODENAME}-prod/ ${VERSION_CODENAME} main"
          packages:
            #- dotnet-sdk-9.0
            - dotnet-sdk-10.0
            - powershell
            - dotnet-sdk-8.0
            - azure-functions-core-tools-4

        # Azure CLI (dedicated repo - not available in the shared Microsoft prod repo for noble)
        - name: azure-cli
          key_url: https://packages.microsoft.com/keys/microsoft.asc
          repo: "deb [arch=${MS_ARCH}] https://packages.microsoft.com/repos/azure-cli/ ${VERSION_CODENAME} main"
          packages:
            - azure-cli

        # VS Code
        - name: vscode
          key_url: https://packages.microsoft.com/keys/microsoft.asc
          repo: "deb [arch=${MS_ARCH}] https://packages.microsoft.com/repos/code stable main"
          packages:
            - code

        # Helm
        - name: helm
          key_url: https://packages.buildkite.com/helm-linux/helm-debian/gpgkey
          repo: "deb [signed-by=${SIGNING_FILE}] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main"
          packages:
            - helm

        # HashiCorp (Terraform)
        - name: hashicorp
          key_url: https://apt.releases.hashicorp.com/gpg
          repo: "deb [arch=${MS_ARCH}] https://apt.releases.hashicorp.com ${VERSION_CODENAME} main"
          packages:
            - terraform


  # ============================================================================
  # ALT-DEV PROFILE
  # Alternative development with Rust and Go, extending dev profile
  # ============================================================================
  alt-dev:
    extends: dev

    install:
      scripts:
        - scripts/install-rust.sh
        - scripts/install-go.sh

  # ============================================================================
  # DEFAULT PROFILE
  # Alias for dev profile (full development setup)
  # ============================================================================
  default:
    extends: dev
