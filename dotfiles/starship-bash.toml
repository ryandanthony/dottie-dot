# Starship Configuration for Bash - Managed by dottie
# https://starship.rs/config/
# Style: Powerline with green color scheme (to distinguish from PowerShell blue)

# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Timeout for commands executed by starship (in milliseconds)
command_timeout = 1000

# Powerline format with green color scheme
format = """
[](fg:#1B4332)\
$os\
$username\
[](bg:#2D6A4F fg:#1B4332)\
$directory\
[](fg:#2D6A4F bg:#40916C)\
$git_branch\
$git_status\
[](fg:#40916C bg:#52B788)\
$dotnet\
$docker_context\
$azure\
$kubernetes\
$terraform\
[](fg:#52B788 bg:#74C69D)\
$time\
[ ](fg:#74C69D)\
"""

# Disable the blank line at the start of the prompt
add_newline = false

[os]
style = "bg:#1B4332 fg:#FFFFFF"
disabled = true

[username]
show_always = true
style_user = "bg:#1B4332 fg:#FFFFFF"
style_root = "bg:#1B4332 fg:#FF6B6B"
format = '[ $user ]($style)'
disabled = false

[hostname]
ssh_only = true
style = "bg:#1B4332 fg:#FFFFFF"
format = '[@$hostname ]($style)'
disabled = false

[directory]
style = "bg:#2D6A4F fg:#FFFFFF"
format = "[ $path ]($style)"
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = false
read_only = " 🔒"

[git_branch]
symbol = " "
style = "bg:#40916C fg:#FFFFFF"
format = '[$symbol$branch ]($style)'

[git_status]
style = "bg:#40916C fg:#FFD93D"
format = '[$all_status$ahead_behind]($style)'
conflicted = '⚑'
ahead = '⇡'
behind = '⇣'
diverged = '⇕'
untracked = '?'
stashed = '*'
modified = '!'
staged = '+'
renamed = '»'
deleted = '✘'
up_to_date = ''

[dotnet]
symbol = " "
style = "bg:#52B788 fg:#FFFFFF"
format = '[$symbol($version) ]($style)'
heuristic = true

[docker_context]
symbol = " "
style = "bg:#52B788 fg:#FFFFFF"
format = '[$symbol$context ]($style)'
only_with_files = true
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']

[azure]
disabled = false
symbol = "󰠅 "
style = "bg:#52B788 fg:#FFFFFF"
format = '[$symbol($subscription) ]($style)'

[kubernetes]
symbol = "󱃾 "
style = "bg:#52B788 fg:#FFFFFF"
format = '[$symbol$context(\($namespace\)) ]($style)'
disabled = false

[terraform]
symbol = "󱁢 "
style = "bg:#52B788 fg:#FFFFFF"
format = '[$symbol$workspace ]($style)'

[time]
disabled = false
time_format = "%H:%M"
style = "bg:#74C69D fg:#1B4332"
format = '[ $time ]($style)'

[cmd_duration]
min_time = 2000
format = 'took [$duration]($style) '
style = 'yellow bold'
show_milliseconds = false

[character]
disabled = true

[line_break]
disabled = true
